name: prepare-pages-artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pages-prepare.yml
      - docs/web-release.md
      - package.json
      - scripts/**
      - src/**

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages
